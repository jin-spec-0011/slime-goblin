<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b3447">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Element Slime Defense</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="stat"><span class="k">라운드</span><b id="hRound">1/10</b></div>
    <div class="stat"><span class="k">거점</span><b id="hBase">20</b></div>
    <div class="stat"><span class="k">배치</span><b id="hCount">0/50</b></div>
    <div class="stat"><span class="k">촉매</span><b><img class="ico" src="assets/item_catalyst.png" alt=""><span id="hCat">2</span></b></div>
    <div class="stat timer"><span class="k" id="hPhase">준비</span><div class="bar"><i id="hTick"></i></div></div>
  </header>

  <section class="panel">
    <div class="ptitle">전장 <span class="sub">ㄹ자로 오는 고블린이 슬라임 칸에 들어가면 슬라임 안에 갇혀 대결</span></div>
    <canvas id="boardCv" aria-label="전장 5x5"></canvas>
  </section>

  <section class="panel deck">
    <div class="ptitle">덱 <b id="qCount">0</b> <span class="sub">필드가 가득 차면 여기에 쌓임 · 카드를 판으로 드래그 (같은 슬라임 위 = 겹치기)</span></div>
    <div id="queue" class="qrow"></div>
  </section>

  <div id="info" class="info">준비 중…</div>

  <nav class="actions">
    <button class="btn" id="bStart">시작</button>
    <button class="btn" id="bCombo">조합</button>
    <button class="btn" id="bMega">메가</button>
    <button class="btn" id="bSpeed">×1</button>
    <button class="btn" id="bPause">정지</button>
    <button class="btn" id="bHelp">?</button>
  </nav>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="mcard">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="mbtns"><button class="btn" id="mOk">확인</button><button class="btn hidden" id="mAlt">다시 하기</button></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
